<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>पहाड़ — Live Dummy</title>
<style>
:root{--g:#07584e;--gd:#043c36;--gs:#eaf5f1;--ink:#17302e;--muted:#6b7b79;--line:#dbe6e2;--bg:#f5f7f6;--white:#fff;--orange:#d88a28;--red:#c84740;--blue:#286fd3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Devanagari",sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}.top{background:var(--gd);color:#d8e7e3;font-size:12px;padding:7px 4%}.nav{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 4%;gap:28px;position:sticky;top:0;z-index:20}.brand{font-family:Georgia,serif;font-size:29px;font-weight:700;color:var(--g);min-width:150px}.brand small{font:10px Arial;color:#73827f;display:block}.menu{display:flex;gap:5px;flex:1}.menu button{border:0;background:none;padding:11px 12px;border-radius:8px;font-weight:700;color:#263b39}.menu button:hover,.menu button.active{background:var(--gs);color:var(--g)}.topSearch{width:190px;padding:9px;border:1px solid var(--line);border-radius:8px}.hero{background:var(--g);color:white;padding:62px 8% 54px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;opacity:.78}.hero h1{font:700 47px/1.1 Georgia,serif;max-width:760px;margin:13px 0}.hero p{max-width:700px;line-height:1.7;color:#dcece8}.search{display:flex;max-width:720px;background:#fff;padding:5px;border-radius:10px;margin-top:22px}.search input{flex:1;border:0;outline:0;padding:13px}.search button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:0 22px;font-weight:800}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.chip{border:1px solid #ffffff38;background:#ffffff12;color:white;padding:7px 11px;border-radius:99px;font-size:12px}.wrap{max-width:1200px;margin:auto;padding:0 18px}.section{padding:35px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.head h2{font:700 27px Georgia,serif;margin:0}.head p{font-size:13px;color:var(--muted);margin:5px 0 0}.more{border:0;background:none;color:var(--g);font-weight:800}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 7px 22px #0b42300b}.card h3{font-size:16px;line-height:1.45;margin:8px 0}.card p{font-size:13px;line-height:1.65;color:var(--muted)}.tag{display:inline-block;background:var(--blue);color:#fff;font-size:10px;font-weight:800;border-radius:5px;padding:5px 7px}.tag.red{background:var(--red)}.tag.green{background:var(--g)}.scheme{border-top:3px solid var(--g)}.scheme .status{color:#147056;font-size:11px;font-weight:800}.schemeSection{background:var(--gs);border-block:1px solid #d7e8e2}.farmer{background:var(--gd);color:#fff}.farmer .card{background:#0b5048;border-color:#ffffff22;color:#fff}.farmer p{color:#cfe0dc}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{text-align:center;border:1px solid var(--line);padding:13px;border-radius:9px;background:#fff}.step b{font-size:12px}.num{margin:auto auto 7px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#fff;font-weight:800}.pageHead{background:var(--g);color:#fff;padding:38px 0}.pageHead h1{font:700 40px Georgia,serif;margin:7px 0}.pageHead p{max-width:750px;line-height:1.7;color:#d6e8e3}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filter{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px}.filter.active{background:var(--gs);color:var(--g)}.detailHero{display:grid;grid-template-columns:1fr 1fr;gap:25px;padding:34px 0}.dummyVisual{background:linear-gradient(145deg,#dcece6,#7ba49a);border-radius:15px;min-height:300px;display:grid;place-items:center;color:#315c54;font-size:42px;font-family:Georgia,serif}.detailHero h1{font:700 40px Georgia,serif;line-height:1.15}.status{display:inline-block;background:#e0f2e8;color:#147052;border-radius:99px;padding:7px 11px;font-size:11px;font-weight:800}.detailNav{position:sticky;top:72px;background:#fff;border-block:1px solid var(--line);z-index:10}.detailNav .wrap{display:flex;gap:22px;overflow:auto;padding:11px 18px}.detailNav button{border:0;background:none;white-space:nowrap;font-weight:800;font-size:12px}.detailGrid{display:grid;grid-template-columns:1fr 290px;gap:17px;padding:26px 18px}.side{height:max-content}.footer{background:var(--gd);color:#cfe0dc;padding:35px 0;margin-top:20px}.footerGrid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:25px}.footer a,.footer button{display:block;background:none;border:0;color:#cfe0dc;padding:5px 0;text-align:left}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#17302e;color:#fff;padding:12px 17px;border-radius:9px;display:none;z-index:99}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:100}.modalBox{background:#fff;border-radius:13px;width:min(520px,calc(100% - 30px));padding:22px}.modalBox h2{margin-top:0}.close{float:right;border:0;background:none;font-size:22px}.mobileMenu{display:none}
@media(max-width:900px){.menu{display:none}.topSearch{display:none}.mobileMenu{display:block;margin-left:auto;border:0;background:none;font-size:22px}.grid4,.grid3{grid-template-columns:1fr 1fr}.detailHero,.detailGrid,.grid2{grid-template-columns:1fr}.steps{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.hero{padding:43px 6%}.hero h1{font-size:34px}.grid4,.grid3{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.nav{padding:0 4%;height:66px}.brand{font-size:25px}.detailHero h1,.pageHead h1{font-size:31px}.footerGrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalBox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const schemes=[
["किसान उपकरण सहायता योजना","किसान","कृषि उपकरण से जुड़ी पात्रता, लाभ और आवेदन की जानकारी"],
["महिला स्वरोजगार योजना","महिला","स्वरोजगार शुरू करने से जुड़ी सहायता और प्रक्रिया"],
["मेधावी छात्रवृत्ति योजना","शिक्षा","पात्र विद्यार्थियों के लिए शैक्षिक सहायता"],
["स्वास्थ्य सहायता योजना","स्वास्थ्य","निर्धारित उपचार के लिए सहायता की जानकारी"],
["युवा स्वरोजगार सहायता","रोजगार","युवाओं के लिए उद्यम और स्वरोजगार से जुड़ी जानकारी"],
["कृषि विकास सहायता","किसान","कृषि से जुड़ी सहायता और आवेदन माध्यम"]
];
const news=[
["सीएम दौरा","मुख्यमंत्री का दौरा: क्षेत्र की मांग, जरूरत और घोषणा से आगे क्या बदलेगा?"],
["टॉप क्रेडिट","आज उत्तराखंड में सबसे ज्यादा वायरल क्या रहा?"],
["विपक्ष का हाल","कांग्रेस और यूकेडी की बड़ी राजनीतिक गतिविधि"],
["रोचक खबर","पहाड़ की ऐसी कहानी जिसे जानना जरूरी है"],
["हादसा","हादसे में क्या हुआ और प्रशासन ने क्या किया"],
["क्राइम","उत्तराखंड की बड़ी आपराधिक घटना का पूरा घटनाक्रम"],
["स्पोर्ट्स","राज्य स्तरीय प्रतियोगिता में उत्तराखंड के खिलाड़ियों का प्रदर्शन"],
["वायरल","सोशल मीडिया पर उत्तराखंड से क्या वायरल रहा"],
["फिल्म","फिल्म और उत्तराखंड का आज का कनेक्शन"],
["हमारे बारे में","आज पहाड़ पर क्या नया जुड़ा"]
];
function header(active="home"){return `<div class="top">उत्तराखंड के लिए · उत्तराखंड की अपनी जानकारी</div><nav class="nav"><button class="brand" style="border:0;background:none;text-align:left" onclick="go('home')">पहाड़<small>हमारे उत्तराखंड की अपनी साइट</small></button><div class="menu">
${[['home','होम'],['schemes','योजनाएं'],['farmer','किसान'],['news','खबरें'],['districts','जिले'],['videos','वीडियो'],['about','हमारे बारे में']].map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div><input class="topSearch" placeholder="कुछ खोजें..." onkeydown="if(event.key==='Enter')search(this.value)"><button class="mobileMenu" onclick="mobileNav()">☰</button></nav>`}
function footer(){return `<footer class="footer"><div class="wrap footerGrid"><div><b style="font:25px Georgia">पहाड़</b><p>योजनाओं, खबरों और उत्तराखंड से जुड़ी उपयोगी जानकारी एक जगह।</p></div><div><b>योजनाएं</b><button onclick="go('schemes')">सभी योजनाएं</button><button onclick="openScheme(0)">योजना detail</button></div><div><b>जानकारी</b><button onclick="go('farmer')">किसान</button><button onclick="go('districts')">जिले</button><button onclick="go('news')">खबरें</button></div><div><b>सहायता</b><button onclick="toast('संपर्क पेज खुलेगा')">संपर्क</button><button onclick="toast('सुधार भेजने का फॉर्म खुलेगा')">सुधार भेजें</button></div></div></footer>`}
function home(){return header('home')+`<section class="hero"><div class="eyebrow">उत्तराखंड · योजनाएं · खबरें · किसान</div><h1>उत्तराखंड की हर जरूरी जानकारी<br>एक जगह</h1><p>योजना का लाभ कैसे लें, आज की 10 जरूरी खबरें, किसान की जानकारी और उत्तराखंड के हर जिले की उपयोगी जानकारी।</p><form class="search" onsubmit="event.preventDefault();search(this.q.value)"><input name="q" placeholder="किस योजना, खबर या जानकारी को खोजें..."><button>खोजें</button></form><div class="chips">${['सभी योजनाएं','किसान','महिला','शिक्षा','स्वास्थ्य','रोजगार','जिले','वीडियो'].map(x=>`<span class="chip" onclick="search('${x}')">${x}</span>`).join('')}</div></section>
<section class="section"><div class="wrap"><div class="head"><div><h2>आज की 10 खबरें</h2><p>उत्तराखंड का पूरा दिन, एक नजर में</p></div><button class="more" onclick="go('news')">सभी खबरें →</button></div><div class="grid3">${news.slice(0,3).map((n,i)=>`<article class="card"><span class="tag ${i===2?'red':''}">${i+1}. ${n[0]}</span><h3>${n[1]}</h3><p>आज · 5 मिनट पढ़ें · ▶ वीडियो</p></article>`).join('')}</div></div></section>
<section class="section schemeSection"><div class="wrap"><div class="head"><div><h2>आज की योजना</h2><p>आज लोगों के काम की एक योजना</p></div><button class="more" onclick="go('schemes')">सभी योजनाएं →</button></div><div class="grid4">${schemes.slice(0,4).map((s,i)=>schemeCard(s,i)).join('')}</div></div></section>
<section class="section farmer"><div class="wrap"><div class="head"><div><h2>किसान विशेष</h2><p style="color:#cfe0dc">किसान की जानकारी सीरियल में</p></div><button class="more" style="color:#fff" onclick="go('farmer')">किसान सेक्शन →</button></div><div class="grid2">${[['01','किसान योजनाएं'],['02','पात्रता'],['03','आवेदन'],['04','दस्तावेज'],['05','अनुदान'],['06','बाजार']].map(x=>`<button class="card" style="text-align:left" onclick="go('farmer')"><b>${x[0]} · ${x[1]}</b><p>इस हिस्से में क्या मिलेगा →</p></button>`).join('')}</div></div></section>
<section class="section" id="districts"><div class="wrap"><div class="head"><div><h2>उत्तराखंड के जिले</h2><p>जिले के हिसाब से जानकारी</p></div><button class="more" onclick="go('districts')">सभी जिले →</button></div><div class="grid4">${['देहरादून','हरिद्वार','उत्तरकाशी','चमोली','रुद्रप्रयाग','टिहरी गढ़वाल','पौड़ी गढ़वाल','अल्मोड़ा'].map(x=>`<button class="card" onclick="openDistrict('${x}')"><b>${x}</b><p>जिले की योजनाएं, खबरें और जानकारी →</p></button>`).join('')}</div></div></section>
<section class="section"><div class="wrap"><div class="head"><div><h2>वीडियो</h2><p>योजना समझिए, खबर देखिए</p></div><button class="more" onclick="go('videos')">सभी वीडियो →</button></div><div class="grid3"><button class="card" onclick="openVideo('किसान उपकरण सहायता योजना')">▶ <h3>5 मिनट में समझिए: किसान योजना</h3><p>योजना एक्सप्लेनर</p></button><button class="card" onclick="openVideo('आज की 10 खबरें')">▶ <h3>आज की 10 खबरें</h3><p>दैनिक वीडियो</p></button><button class="card" onclick="openVideo('उत्तराखंड में युवाओं के लिए क्या बदला?')">▶ <h3>उत्तराखंड में युवाओं के लिए क्या बदला?</h3><p>समझिए</p></button></div></div></section>${footer()}`}
function schemeCard(s,i){return `<button class="card scheme" style="text-align:left" onclick="openScheme(${i})"><span class="scheme status">● वर्तमान में लाभ लिया जा सकता है</span><div style="font-size:11px;color:var(--g);font-weight:800;margin-top:10px">${s[1]}</div><h3>${s[0]}</h3><p>${s[2]}</p><b style="color:var(--g);font-size:12px">पूरी जानकारी →</b></button>`}
function schemesPage(){return header('schemes')+`<section class="pageHead"><div class="wrap"><div class="eyebrow">उत्तराखंड की योजनाएं</div><h1>कौन-सी योजना अभी आपके काम की है?</h1><p>हर योजना को लाभार्थी के सवालों के हिसाब से समझें—पात्रता, लाभ, आवेदन, दस्तावेज और उपलब्ध सरकारी आंकड़े।</p></div></section><section class="section"><div class="wrap"><div class="filters">${['all','किसान','महिला','शिक्षा','स्वास्थ्य','रोजगार'].map((x,i)=>`<button class="filter ${i===0?'active':''}" onclick="filterSchemes('${x}',this)">${x==='all'?'सभी':x}</button>`).join('')}</div><div id="schemeResults" class="grid3">${schemes.map((s,i)=>schemeCard(s,i)).join('')}</div></div></section>${footer()}`}
function filterSchemes(f,b){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('schemeResults').innerHTML=schemes.map((s,i)=>[f==='all'||s[1]===f,schemeCard(s,i)]).filter(x=>x[0]).map(x=>x[1]).join('')}
function schemeDetail(i){let s=schemes[i]||schemes[0];return header('schemes')+`<section class="section"><div class="wrap"><div style="font-size:12px;color:#71827f">होम → योजनाएं → ${s[1]} → ${s[0]}</div><div class="detailHero"><div class="dummyVisual">योजना<br>VISUAL</div><div><span class="status">● वर्तमान में लाभ लिया जा सकता है</span><div class="eyebrow" style="color:#6d817d;margin-top:16px">${s[1]} · उत्तराखंड</div><h1>${s[0]}</h1><p style="line-height:1.8;color:var(--muted)">${s[2]}। यहां योजना की वास्तविक पात्रता, लाभ, आवेदन माध्यम, दस्तावेज और स्रोत बाद में CMS से जुड़ेंगे।</p><div class="grid2"><div class="card"><small>लाभार्थी</small><br><b>पात्र व्यक्ति</b></div><div class="card"><small>आवेदन</small><br><b>ऑनलाइन / कार्यालय</b></div></div></div></div></div></section><div class="detailNav"><div class="wrap">${['सारांश','पात्रता','लाभ','आवेदन प्रक्रिया','दस्तावेज','जिलेवार स्थिति','FAQs','स्रोत'].map(x=>`<button onclick="toast('${x} सेक्शन')">${x}</button>`).join('')}</div></div><section class="section"><div class="wrap detailGrid"><main><div class="card"><h2>योजना का संक्षिप्त परिचय</h2><p>सरकारी भाषा के बजाय लाभार्थी के सवालों के क्रम में जानकारी दिखाई जाएगी।</p></div><div class="card"><h2>कौन लाभ ले सकता है?</h2><ul><li>वर्तमान नियमों के अनुसार पात्र आवेदक</li><li>निर्धारित श्रेणी/मानदंड पूरा करने वाला व्यक्ति</li><li>जरूरी दस्तावेज वाला आवेदक</li></ul></div><div class="card"><h2>आवेदन की स्टेप-बाय-स्टेप प्रक्रिया</h2><div class="steps">${['पात्रता जांचें','फॉर्म भरें','दस्तावेज लगाएं','आवेदन जमा करें','स्थिति देखें'].map((x,j)=>`<div class="step"><div class="num">${j+1}</div><b>${x}</b></div>`).join('')}</div></div><div class="card"><h2>जिलेवार और वार्षिक डेटा</h2><p><b>डेटा उपलब्ध नहीं है तो अनुमान नहीं लगाया जाएगा।</b></p><p>जहां संबंधित विभाग ने सार्वजनिक आंकड़े जारी नहीं किए हैं, वहां यही स्पष्ट रूप से बताया जाएगा।</p></div><div class="card"><h2>स्रोत और सत्यापन</h2><p>शासनादेश, विभागीय दस्तावेज, आधिकारिक पोर्टल और अन्य सत्यापित स्रोत यहां क्रमवार दिखेंगे।</p></div></main><aside class="side"><div class="card"><h3>योजना का वीडियो</h3><button onclick="openVideo('${s[0]}')" style="width:100%;padding:45px 10px;border:0;background:var(--gd);color:#fff;border-radius:9px;font-size:30px">▶</button></div><div class="card" style="margin-top:14px"><h3>आधिकारिक लिंक</h3><button class="more" onclick="toast('आधिकारिक आवेदन लिंक खुलेगा')">आधिकारिक वेबसाइट ↗</button></div></aside></div></div></section>${footer()}`}
function farmerPage(){return header('farmer')+`<section class="pageHead"><div class="wrap"><div class="eyebrow">किसान विशेष</div><h1>किसान की जानकारी — सीरियल में</h1><p>योजनाओं से लेकर पात्रता, आवेदन, दस्तावेज, अनुदान, फसल और बाजार तक।</p></div></section><section class="section"><div class="wrap"><div class="card"><h2>किसान को क्या जानना है?</h2><p>यह सेक्शन किसान को जरूरत के क्रम में जानकारी देगा। हर बटन अगले संबंधित हिस्से पर ले जाएगा।</p><div class="steps">${['किसान योजनाएं','पात्रता','आवेदन','दस्तावेज','अनुदान'].map((x,i)=>`<button class="step" onclick="${i===0?"go('schemes')":"toast(''+x+' का सेक्शन खुलेगा')"}"><div class="num">${i+1}</div><b>${x}</b></button>`).join('')}</div></div></div></section><section class="section schemeSection"><div class="wrap"><div class="head"><div><h2>किसान के लिए योजनाएं</h2><p>वर्तमान में उपयोगी जानकारी</p></div></div><div class="grid3">${schemes.filter(s=>s[1]==='किसान').map((s,i)=>schemeCard(s,i)).join('')}</div></div></section>${footer()}`}
function newsPage(){return header('news')+`<section class="pageHead"><div class="wrap"><div class="eyebrow">उत्तराखंड न्यूज़</div><h1>आज की 10 खबरें</h1><p>सिर्फ घटना नहीं—पृष्ठभूमि, मांग, जरूरत, असर और आगे क्या, उसके साथ।</p></div></section><section class="section"><div class="wrap"><div class="grid3">${news.map((n,i)=>`<button class="card" style="text-align:left" onclick="openNews(${i})"><span class="tag ${i===4||i===5?'red':i===1||i===7?'green':''}">${i+1}. ${n[0]}</span><h3>${n[1]}</h3><p>आज · पूरी खबर · ▶ वीडियो</p></button>`).join('')}</div></div></section>${footer()}`}
function districts(){return header('districts')+`<section class="pageHead"><div class="wrap"><div class="eyebrow">उत्तराखंड</div><h1>13 जिले</h1><p>हर जिले के लिए योजनाएं, खबरें, आंकड़े और स्थानीय जानकारी अलग से खुलेगी।</p></div></section><section class="section"><div class="wrap"><div class="grid4">${['अल्मोड़ा','बागेश्वर','चमोली','चंपावत','देहरादून','हरिद्वार','नैनीताल','पौड़ी गढ़वाल','पिथौरागढ़','रुद्रप्रयाग','टिहरी गढ़वाल','उधम सिंह नगर','उत्तरकाशी'].map(x=>`<button class="card" onclick="openDistrict('${x}')"><h3>${x}</h3><p>जिला प्रोफाइल →</p></button>`).join('')}</div></div></section>${footer()}`}
function videos(){return header('videos')+`<section class="pageHead"><div class="wrap"><div class="eyebrow">वीडियो</div><h1>वीडियो लाइब्रेरी</h1><p>योजना एक्सप्लेनर, दिन की खबरें और विशेष रिपोर्ट।</p></div></section><section class="section"><div class="wrap"><div class="grid3">${['किसान उपकरण सहायता योजना','आज की 10 खबरें','मुख्यमंत्री का दौरा: क्या बदलेगा?','किसान के लिए दस्तावेज','उत्तराखंड में युवाओं के लिए क्या बदला?','आज का टॉप क्रेडिट'].map(x=>`<button class="card" onclick="openVideo('${x}')"><div style="background:var(--gd);color:#fff;padding:55px 0;border-radius:8px;font-size:30px">▶</div><h3>${x}</h3><p>वीडियो · 5 मिनट</p></button>`).join('')}</div></div></section>${footer()}`}
function about(){return header('about')+`<section class="pageHead"><div class="wrap"><div class="eyebrow">हमारे बारे में</div><h1>हम यह क्यों बना रहे हैं?</h1><p>उत्तराखंड की योजनाओं, खबरों और उपयोगी जानकारी को लोगों के काम की भाषा में एक जगह लाना।</p></div></section><section class="section"><div class="wrap grid2"><div class="card"><h2>हमारा तरीका</h2><p>हर योजना में पात्रता, लाभ, आवेदन, दस्तावेज, वर्तमान स्थिति और स्रोत। उपलब्ध सरकारी डेटा नहीं है तो साफ-साफ बताया जाएगा।</p></div><div class="card"><h2>सुधार और सत्यापन</h2><p>गलत या पुरानी जानकारी दिखने पर सुधार भेजने का रास्ता होगा। महत्वपूर्ण जानकारी के साथ स्रोत दिखेंगे।</p><button class="more" onclick="toast('सुधार फॉर्म खुलेगा')">सुधार भेजें →</button></div></div></section>${footer()}`}
function search(q){if(!q)return;let found=schemes.filter(s=>(s.join(' ')).includes(q));openModal(`<h2>खोज परिणाम</h2><p>आपने खोजा: <b>${q}</b></p>${found.length?found.map((s,i)=>`<button style="display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:13px;margin:7px 0;border-radius:8px" onclick="closeModal();openScheme(${schemes.indexOf(s)})"><b>${s[0]}</b><br><small>${s[1]} · पूरी जानकारी →</small></button>`).join(''):'<p>डमी में इस खोज का परिणाम नहीं मिला। असली साइट में CMS का पूरा search यहां आएगा।'}</p>`)}
function openScheme(i){document.getElementById('app').innerHTML=schemeDetail(i);scrollTo(0,0)}
function openNews(i){let n=news[i];openModal(`<span class="tag">${i+1}. ${n[0]}</span><h2>${n[1]}</h2><p>यहां पूरी खबर खुलेगी। इसमें घटना, पृष्ठभूमि, मांग, जरूरत, असर, संबंधित पुराने अपडेट और वीडियो जोड़ा जा सकेगा।</p><button onclick="openVideo('${n[1]}')" style="background:var(--g);color:#fff;border:0;padding:11px 15px;border-radius:8px">▶ वीडियो देखें</button>`)}
function openDistrict(x){openModal(`<div class="eyebrow">जिला प्रोफाइल</div><h2>${x}</h2><p>यहां ${x} की योजनाएं, आज की खबरें, स्थानीय आंकड़े, प्रमुख स्थान और संबंधित जानकारी खुलेगी।</p><button onclick="closeModal();go('schemes')" style="background:var(--g);color:#fff;border:0;padding:10px 14px;border-radius:8px">जिले की योजनाएं →</button>`)}
function openVideo(x){openModal(`<div style="background:var(--gd);color:#fff;border-radius:10px;padding:70px 0;text-align:center;font-size:45px">▶</div><h2>${x}</h2><p>यह demo video player है। Live site में यहां actual video player, transcript और related links आएंगे।</p>`)}
function openModal(x){document.getElementById('modalContent').innerHTML=x;document.getElementById('modal').style.display='grid'}
function closeModal(){document.getElementById('modal').style.display='none'}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function mobileNav(){openModal(`<h2>मेनू</h2>${[['home','होम'],['schemes','योजनाएं'],['farmer','किसान'],['news','खबरें'],['districts','जिले'],['videos','वीडियो'],['about','हमारे बारे में']].map(x=>`<button style="display:block;width:100%;padding:12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff" onclick="closeModal();go('${x[0]}')">${x[1]}</button>`).join('')}`)}
function go(page){let f={home,schemes:schemesPage,farmer:farmerPage,news:newsPage,districts,videos,about}[page]||home;document.getElementById('app').innerHTML=f();scrollTo(0,0);history.replaceState({},'', '#'+page)}
go(location.hash.slice(1)||'home');
</script>
</body></html>
