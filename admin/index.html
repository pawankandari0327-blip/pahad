<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KATHYŪḌ Editor V3</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#0b4f46;--green2:#17675c;--ink:#17332e;--muted:#6b7b75;--line:#dce5e0;--bg:#f3f5f2;--gold:#c78d32;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Devanagari",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px}.wrap{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--green);color:white;padding:22px 16px;overflow:auto}.brand{font-size:24px;font-weight:800;letter-spacing:.5px}.sub{font-size:10px;opacity:.7;margin:2px 0 22px}.nav-title{font-size:10px;opacity:.55;margin:18px 8px 5px;text-transform:uppercase}.nav button{width:100%;display:block;text-align:left;background:transparent;color:#e6f0ed;margin:3px 0}.nav button:hover,.nav button.active{background:var(--green2)}.main{margin-left:248px;padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.top h1{margin:0}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 5px 24px #00000008}.login{max-width:430px;margin:12vh auto}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #c9d6d0;border-radius:8px;padding:10px;background:#fff;color:var(--ink)}.field textarea{min-height:120px;resize:vertical}.muted{color:var(--muted);font-size:13px}.btn{background:var(--green);color:white}.btn2{background:#e9efec;color:var(--ink)}.danger{background:var(--danger);color:white}.gold{background:#fff3d7;color:#714c12}.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:9px;margin-top:14px}.item{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.tools{display:flex;gap:7px;flex-wrap:wrap}.status{font-size:11px;padding:4px 8px;border-radius:20px}.published{background:#d9f3df}.draft{background:#fff0c9}.unpublished{background:#e8ece9}.deleted{background:#f9dddd;color:#8c1d18}.editorbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.editorbar button{padding:7px 9px;background:#e9efec}.editor{min-height:420px;border:1px solid #c9d6d0;border-radius:9px;padding:15px;background:white;outline:none;line-height:1.7}.editor:focus{border-color:var(--green2)}.tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:-18px -18px 16px;padding:12px 18px}.tabs button{background:transparent}.tabs button.active{background:#e8eeeb}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef3f0;font-size:11px}.preview-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white}.preview-img{height:170px;background:#dfe7e2 center/cover no-repeat}.preview-body{padding:14px}.preview-body h3{margin:8px 0;font-size:21px}.article-preview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;max-width:900px;margin:auto}.article-preview img{max-width:100%;height:auto}.article-preview h1{font-size:38px;line-height:1.15}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:white;padding:12px 16px;border-radius:9px;z-index:20}.drop{border:1px dashed #aebdb6;border-radius:9px;padding:14px;background:#fafcfb}.small{font-size:11px}.hide{display:none!important}.help{background:#f6f8f6;border-radius:9px;padding:10px;font-size:12px;color:#52635d}.checkrow{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0}.checkrow input{width:auto}.login input{margin-bottom:5px}
@media(max-width:900px){.side{position:static;width:100%;height:auto}.main{margin:0;padding:14px}.grid,.two{grid-template-columns:1fr}.top{align-items:flex-start}.article-preview h1{font-size:29px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL='https://bmvrryyrnjwsvcgstpgx.supabase.co';
const SUPABASE_KEY='sb_publishable_DKkBIkCw4rwV3THJoDk8Yw_fYYe5Up6';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,current=null,articles=[],listMode='all',activeTab='content';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('article-'+Date.now());
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
async function init(){const {data:{session}}=await sb.auth.getSession();user=session?.user||null;user?showApp():showLogin()}
function showLogin(){app.innerHTML=`<div class="login card"><div class="brand">KATHYŪḌ</div><div class="sub">THE NEW PAHAD · EDITOR V3</div><h1>Editor Login</h1><div class="field"><label>Email</label><input id="loginEmail" type="email" value="editor@kathyud.in"></div><div class="field"><label>Password</label><input id="loginPassword" type="password"></div><button class="btn" onclick="login()">Login</button><p class="muted">यह panel केवल अधिकृत editor के लिए है।</p></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:loginEmail.value,password:loginPassword.value});if(error)return toast(error.message);location.reload()}
async function logout(){await sb.auth.signOut();location.reload()}
function showApp(){app.innerHTML=`<div class="wrap"><aside class="side"><div class="brand">KATHYŪḌ</div><div class="sub">THE NEW PAHAD · EDITOR V3</div><div class="nav"><button class="active" id="navHome" onclick="home()">Home</button><button onclick="newArticle()">＋ Add New</button><button onclick="loadList('all')">Search Articles</button><button onclick="loadList('priority')">Priority</button><button onclick="loadList('unpublished')">Unpublish</button><button onclick="loadList('deleted')">Deleted Articles</button></div><div class="nav-title">Sections</div><div class="nav"><button onclick="loadSection('आज की 10')">आज की 10</button><button onclick="loadSection('योजनाएं')">योजनाएं</button><button onclick="loadSection('किसान')">किसान</button><button onclick="loadSection('वीडियो')">वीडियो</button><button onclick="loadSection('अन्य')">अन्य</button></div><hr style="border-color:#ffffff22;margin:20px 0"><div class="small" style="opacity:.7">SIGNED IN</div><div style="font-size:12px;word-break:break-all;margin-top:5px">${esc(user.email)}</div><button class="nav" style="margin-top:12px;background:#ffffff18;color:#fff;width:100%;text-align:left" onclick="logout()">Logout</button></aside><main class="main"><div class="top"><div><h1 id="heading">Home</h1><div class="muted">Article & Video Content Studio</div></div><div class="tools"><button class="btn" onclick="newArticle()">＋ Add New</button></div></div><div id="content"></div></main></div>`;home()}
function home(){heading.textContent='Home';content.innerHTML=`<div class="card" style="min-height:520px;display:grid;place-items:center;text-align:center"><div><div style="font-size:44px;font-weight:800">KATHYŪḌ</div><p class="muted">Home selected. यहां से नया Article बनाएं या कोई Section खोलें।</p><p><span class="pill">आज की 10</span> <span class="pill">योजनाएं</span> <span class="pill">किसान</span> <span class="pill">वीडियो</span> <span class="pill">अन्य</span></p></div></div>`}
async function loadSection(sec){listMode='section';heading.textContent=sec;const {data,error}=await sb.from('articles').select('*').eq('section',sec).neq('status','deleted').order('priority',{ascending:true}).order('published_at',{ascending:false});if(error)return toast(error.message);articles=data||[];renderListShell(sec)}
async function loadList(mode){listMode=mode;heading.textContent=mode==='priority'?'Priority':mode==='unpublished'?'Unpublish':mode==='deleted'?'Deleted Articles':'Search Articles';let q=sb.from('articles').select('*').order('priority',{ascending:true}).order('created_at',{ascending:false});if(mode==='unpublished')q=q.eq('status','unpublished');else if(mode==='deleted')q=q.eq('status','deleted');else q=q.neq('status','deleted');const {data,error}=await q;if(error)return toast(error.message);articles=data||[];renderListShell()}
function renderListShell(sec=''){content.innerHTML=`<div class="card"><div class="tools"><input id="searchBox" placeholder="Headline, category, section, tag खोजें..." style="flex:1;min-width:220px;border:1px solid #c9d6d0;border-radius:8px;padding:10px" oninput="renderList()"><button class="btn" onclick="newArticle()">＋ Add New</button></div><div id="list" class="list"></div></div>`;renderList()}
function renderList(){const s=(document.getElementById('searchBox')?.value||'').toLowerCase();let a=articles.filter(x=>`${x.title||''} ${x.category||''} ${x.section||''} ${(x.tags||[]).join(' ')}`.toLowerCase().includes(s));document.getElementById('list').innerHTML=a.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.section||x.category||'')} · ${esc(x.content_type||'news')} · P${x.priority||10} · ${x.homepage_priority?`Home #${x.homepage_priority} · `:''}<span class="status ${x.status}">${esc(x.status)}</span></div></div><div class="tools"><button class="btn2" onclick="editArticle('${x.id}')">Edit</button><button class="danger" onclick="softDelete('${x.id}')">Delete</button></div></div>`).join('')||'<p class="muted">कोई Article नहीं मिला।</p>'}
function blank(){return {title:'',slug:'',excerpt:'',body_html:'',content_type:'news',section:'आज की 10',category:'',priority:10,homepage_priority:'',template:'standard',status:'draft',image_url:'',video_url:'',cover_alt:'',seo_title:'',meta_description:'',seo_keywords:'',canonical_url:'',og_title:'',og_description:'',og_image:'',tags:[],related_article_ids:[],is_home_scheme:false,author_name:'',source_name:'',source_url:''}}
function newArticle(){current=null;activeTab='content';showEditor(blank())}
async function editArticle(id){const {data,error}=await sb.from('articles').select('*').eq('id',id).single();if(error)return toast(error.message);current=data;activeTab='content';showEditor(data)}
function showEditor(a){heading.textContent=current?'Edit Article':'Add New Article';const ct=a.content_type||'news';content.innerHTML=`<div class="tabs"><button id="tabContent" class="active" onclick="switchTab('content')">Article</button><button id="tabPlacement" onclick="switchTab('placement')">Placement</button><button id="tabMedia" onclick="switchTab('media')">Media</button><button id="tabSeo" onclick="switchTab('seo')">SEO</button><button id="tabPreview" onclick="switchTab('preview')">Preview</button></div><div id="editorArea"></div>`;renderEditorTab(a,ct)}
function switchTab(t){activeTab=t;['Content','Placement','Media','Seo','Preview'].forEach(x=>document.getElementById('tab'+x)?.classList.toggle('active',x.toLowerCase()===t));renderEditorTab(readForm(),document.getElementById('contentType')?.value||current?.content_type||'news')}
function readForm(){if(!document.getElementById('title'))return current||blank();return {...(current||blank()),title:title.value,slug:slug.value,excerpt:excerpt.value,body_html:body.innerHTML,content_type:contentType.value,section:section.value,category:category.value,priority:Number(priority.value)||10,homepage_priority:homePriority.value?Number(homePriority.value):null,template:template.value,status:articleStatus.value,image_url:imageUrl.value.trim(),video_url:videoUrl.value.trim(),cover_alt:coverAlt.value.trim(),seo_title:seoTitle.value.trim(),meta_description:metaDescription.value.trim(),seo_keywords:seoKeywords.value.trim(),canonical_url:canonicalUrl.value.trim(),og_title:ogTitle.value.trim(),og_description:ogDescription.value.trim(),og_image:ogImage.value.trim(),tags:tagInput.value.split(',').map(x=>x.trim()).filter(Boolean),is_home_scheme:homeScheme.checked,author_name:authorName.value.trim(),source_name:sourceName.value.trim(),source_url:sourceUrl.value.trim()}}
function renderEditorTab(a,ct){const area=document.getElementById('editorArea');if(!area)return;if(activeTab==='preview'){area.innerHTML=`<div class="grid"><div class="card"><h3>Homepage Card Preview</h3>${cardPreview(a)}</div><div class="card"><h3>Full Article Preview</h3>${articlePreview(a)}</div></div>`;return}if(activeTab==='seo'){area.innerHTML=`<div class="card"><h2>SEO</h2><div class="field"><label>SEO Title</label><input id="seoTitle" value="${esc(a.seo_title||'')}" placeholder="Google के लिए title"></div><div class="field"><label>Meta Description</label><textarea id="metaDescription" maxlength="160" placeholder="150–160 characters के आसपास">${esc(a.meta_description||'')}</textarea></div><div class="field"><label>SEO Keywords / Tags</label><input id="seoKeywords" value="${esc(a.seo_keywords||'')}" placeholder="उत्तराखंड, किसान, योजना"></div><div class="field"><label>Canonical URL</label><input id="canonicalUrl" value="${esc(a.canonical_url||'')}" placeholder="जरूरत हो तो पूरा canonical URL"></div><div class="field"><label>Social/OG Title</label><input id="ogTitle" value="${esc(a.og_title||'')}"></div><div class="field"><label>Social/OG Description</label><textarea id="ogDescription">${esc(a.og_description||'')}</textarea></div><div class="field"><label>Social/OG Image URL</label><input id="ogImage" value="${esc(a.og_image||'')}"></div><div class="help">SEO fields Article की सामान्य Headline और Cover Image से अलग रखे गए हैं।</div></div>`;return}if(activeTab==='media'){area.innerHTML=`<div class="grid"><div class="card"><h2>Cover</h2><div class="drop"><b>Computer से Cover Image</b><p class="muted">JPG, PNG, WebP या GIF · अधिकतम 5 MB</p><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button class="btn2" style="margin-top:8px" onclick="uploadCover()">Upload Cover</button></div><div class="field"><label>Cover Image URL</label><input id="imageUrl" value="${esc(a.image_url||'')}" placeholder="Upload के बाद URL यहां आएगा"></div><div class="field"><label>Cover Alt Text</label><input id="coverAlt" value="${esc(a.cover_alt||'')}" placeholder="Image का छोटा वर्णन"></div></div><div class="card"><h2>Video</h2><div class="field"><label>Video URL / Embed URL</label><input id="videoUrl" value="${esc(a.video_url||'')}" placeholder="YouTube या अन्य video URL"></div><div class="help">Video किसी भी Article type में जोड़ा जा सकता है। Video type होने पर यही उसका मुख्य media होगा।</div></div></div>`;return}if(activeTab==='placement'){area.innerHTML=`<div class="grid"><div class="card"><h2>Where does it go?</h2><div class="field"><label>Content Type</label><select id="contentType" onchange="typeChanged()"><option value="news" ${ct==='news'?'selected':''}>News</option><option value="scheme" ${ct==='scheme'?'selected':''}>Scheme</option><option value="farmer" ${ct==='farmer'?'selected':''}>Farmer</option><option value="video" ${ct==='video'?'selected':''}>Video</option><option value="other" ${ct==='other'?'selected':''}>Other</option></select></div><div class="field"><label>Section</label><select id="section"><option ${a.section==='आज की 10'?'selected':''}>आज की 10</option><option ${a.section==='योजनाएं'?'selected':''}>योजनाएं</option><option ${a.section==='किसान'?'selected':''}>किसान</option><option ${a.section==='वीडियो'?'selected':''}>वीडियो</option><option ${a.section==='अन्य'?'selected':''}>अन्य</option></select></div><div class="field"><label>Category</label><input id="category" value="${esc(a.category||'')}" placeholder="जैसे राजनीति, दुर्घटना, कृषि, सब्सिडी"></div><div class="field"><label>Tags</label><input id="tagInput" value="${esc((a.tags||[]).join(', '))}" placeholder="टैग, कॉमा से अलग"></div></div><div class="card"><h2>Homepage Placement</h2><div class="field"><label>Section Priority (1 = ऊपर)</label><input id="priority" type="number" min="1" max="10" value="${a.priority||10}"></div><div class="field"><label>Homepage Priority</label><input id="homePriority" type="number" min="1" max="10" value="${a.homepage_priority??''}" placeholder="खाली = Homepage पर नहीं"></div><div class="field"><label>Card Template / Size</label><select id="template">${['hero','large','standard','compact','box','list'].map(x=>`<option ${a.template===x?'selected':''}>${x}</option>`).join('')}</select></div><label class="checkrow"><input id="homeScheme" type="checkbox" ${a.is_home_scheme?'checked':''}> इसे Homepage की 5 योजनाओं में रखें</label><div class="field"><label>Status</label><select id="articleStatus"><option value="draft" ${a.status==='draft'?'selected':''}>Draft</option><option value="published" ${a.status==='published'?'selected':''}>Published</option><option value="unpublished" ${a.status==='unpublished'?'selected':''}>Unpublished</option><option value="deleted" ${a.status==='deleted'?'selected':''}>Deleted</option></select></div></div></div>`;return}area.innerHTML=`<div class="grid"><div class="card"><div class="field"><label>Headline</label><input id="title" value="${esc(a.title||'')}" oninput="autoSlug()"></div><div class="field"><label>URL Slug</label><input id="slug" value="${esc(a.slug||'')}" placeholder="seo-friendly-url"></div><div class="field"><label>Excerpt / Intro</label><textarea id="excerpt" style="min-height:90px" placeholder="Card और social preview के लिए छोटा परिचय">${esc(a.excerpt||'')}</textarea></div><div class="editorbar"><button onclick="cmd('bold')"><b>B</b></button><button onclick="cmd('italic')"><i>I</i></button><button onclick="cmd('formatBlock','H2')">H2</button><button onclick="cmd('formatBlock','H3')">H3</button><button onclick="cmd('formatBlock','P')">P</button><button onclick="cmd('formatBlock','BLOCKQUOTE')">Quote</button><button onclick="insertInfo()">Info Box</button><button onclick="insertImage()">Image</button><button onclick="insertVideoBlock()">Video</button></div><div id="body" class="editor" contenteditable="true">${a.body_html||''}</div></div><div class="card"><h2>Article Details</h2><div class="field"><label>Author</label><input id="authorName" value="${esc(a.author_name||'')}" placeholder="KATHYŪḌ"></div><div class="field"><label>Source / Department</label><input id="sourceName" value="${esc(a.source_name||'')}" placeholder="Source name"></div><div class="field"><label>Source URL</label><input id="sourceUrl" value="${esc(a.source_url||'')}" placeholder="Official source link"></div><div class="help">Placement, Media और SEO ऊपर के tabs में हैं। पहले Article लिखें, फिर Preview देखें।</div><div class="tools" style="margin-top:16px"><button class="btn" onclick="saveArticle()">Save Draft</button><button class="btn" onclick="saveArticle(true)">Publish</button><button class="btn2" onclick="switchTab('preview')">Preview</button>${current?`<button class="danger" onclick="softDelete('${current.id}')">Delete</button>`:''}</div></div></div>`}
function typeChanged(){const ct=document.getElementById('contentType').value;const s=document.getElementById('section');if(ct==='scheme')s.value='योजनाएं';if(ct==='farmer')s.value='किसान';if(ct==='video')s.value='वीडियो'}
function autoSlug(){if(!current||!slug.value)slug.value=slugify(title.value)}
function cmd(c,v=null){document.execCommand(c,false,v);document.getElementById('body')?.focus()}
function insertInfo(){cmd('insertHTML',`<div style="border-left:4px solid #c78d32;background:#fff6df;padding:13px;margin:14px 0;border-radius:4px"><b>महत्वपूर्ण:</b> यहां जानकारी लिखें।</div><p><br></p>`)}
function insertImage(){const u=prompt('Image URL डालें:');if(u)cmd('insertHTML',`<p><img src="${esc(u)}" alt="" style="max-width:100%;height:auto;border-radius:10px"></p>`)}
function insertVideoBlock(){const u=prompt('Video URL डालें:');if(u)cmd('insertHTML',`<p><a href="${esc(u)}" target="_blank" rel="noopener">वीडियो देखें →</a></p>`)}
async function uploadCover(){const f=document.getElementById('coverFile')?.files?.[0];if(!f)return toast('पहले image चुनें');if(f.size>5*1024*1024)return toast('Cover image 5 MB से बड़ी है');if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type))return toast('केवल JPG, PNG, WebP या GIF');const ext=f.name.split('.').pop().toLowerCase();const path=`covers/${user.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const {error}=await sb.storage.from('kathyud-media').upload(path,f,{contentType:f.type,upsert:false});if(error)return toast(error.message);const {data}=sb.storage.from('kathyud-media').getPublicUrl(path);if(document.getElementById('imageUrl'))document.getElementById('imageUrl').value=data.publicUrl;toast('Cover uploaded')}
function cardPreview(a){const bg=a.image_url?`style="background-image:url('${esc(a.image_url)}')"`:'';return `<div class="preview-card"><div class="preview-img" ${bg}></div><div class="preview-body"><span class="pill">${esc(a.category||a.section||'उत्तराखंड')}</span><h3>${esc(a.title||'Headline')}</h3><p class="muted">${esc(a.excerpt||'Article का छोटा intro यहां दिखेगा।')}</p><small>KATHYŪḌ · ${esc(a.template||'standard')}</small></div></div>`}
function articlePreview(a){return `<article class="article-preview">${a.image_url?`<img src="${esc(a.image_url)}" alt="${esc(a.cover_alt||a.title||'')}">`:''}<p class="muted">${esc(a.category||a.section||'उत्तराखंड')} · ${esc(a.author_name||'KATHYŪḌ')}</p><h1>${esc(a.title||'Headline')}</h1>${a.excerpt?`<p style="font-size:19px;color:#52635d">${esc(a.excerpt)}</p>`:''}<div>${a.body_html||'<p class="muted">Article content यहां दिखाई देगा।</p>'}</div></article>`}
async function saveArticle(forcePublish=false){let a=readForm();if(!a.title.trim())return toast('Headline जरूरी है');if(!a.slug.trim())a.slug=slugify(a.title);if(a.content_type==='scheme')a.section='योजनाएं';if(a.content_type==='farmer')a.section='किसान';if(a.content_type==='video')a.section='वीडियो';if(forcePublish)a.status='published';a.published_at=a.status==='published'?(current?.published_at||new Date().toISOString()):null;a.created_by=current?.created_by||user.id;delete a.id;delete a.created_at;delete a.updated_at;delete a.author_id;delete a.featured_image;a.tags=Array.isArray(a.tags)?a.tags:[];a.related_article_ids=Array.isArray(a.related_article_ids)?a.related_article_ids:[];if(current){const {error}=await sb.from('articles').update(a).eq('id',current.id);if(error)return toast(error.message)}else{const {error}=await sb.from('articles').insert(a);if(error)return toast(error.message)}toast(a.status==='published'?'Published':'Draft saved');loadList('all')}
async function softDelete(id){if(!confirm('Article को Deleted में भेजें?'))return;const {error}=await sb.from('articles').update({status:'deleted'}).eq('id',id);if(error)return toast(error.message);toast('Deleted');loadList('all')}
init();
</script>
